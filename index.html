<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Voxel Showcase | Geometric Morphing OS</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; }
        body {
            background-color: #020617; color: #f8fafc; font-family: 'Sarabun', sans-serif;
            overflow: hidden; width: 100vw; height: 100vh; touch-action: none;
        }
        #canvas-container { position: absolute; top: 0; left: 0; width: 100%; height: 100%; z-index: 1; }
        
        .hud-overlay {
            position: absolute; bottom: 25px; left: 50%; transform: translateX(-50%);
            z-index: 10; pointer-events: none; text-align: center; width: 90%; max-width: 750px;
            font-family: 'Prompt', sans-serif; text-shadow: 0 0 10px rgba(56, 189, 248, 0.5);
        }
        .hud-title { color: #fbbf24; font-size: 1.1rem; font-weight: 600; letter-spacing: 1px; }
        .hud-sub { color: #38bdf8; font-size: 0.85rem; opacity: 0.85; margin-top: 4px; line-height: 1.4; }
    </style>
</head>
<body>

    <div class="hud-overlay">
        <div class="hud-title" id="hud-title">Voxel Geometric Showcase: สุญญตาสู่นวัตกรรม</div>
        <div class="hud-sub" id="hud-sub">คลิกที่ "ผลึกแก้ว" ซ้ายล่างเพื่อเปลี่ยนรูปทรงเรขาคณิต | คลิกที่ฉากเพื่อคืนสู่สุญญตา</div>
    </div>

    <div id="canvas-container"></div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script>
        const P = { void: 0x020617, idle: 0x475569, sphere: 0x38bdf8, pyramid: 0xfbbf24, torus: 0xa855f7 };

        const scene = new THREE.Scene();
        scene.background = new THREE.Color(P.void);
        scene.fog = new THREE.FogExp2(P.void, 0.010);

        const camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 1000);
        camera.position.set(0, 10, 35);

        const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
        document.getElementById('canvas-container').appendChild(renderer.domElement);

        const light = new THREE.PointLight(0xffffff, 2, 100);
        light.position.set(0, 25, 15);
        scene.add(light);
        scene.add(new THREE.AmbientLight(0x404040, 2.5));

        const cellCount = 4000; 
        const voxelGeo = new THREE.BoxGeometry(0.4, 0.4, 0.4);
        const voxelMat = new THREE.MeshPhysicalMaterial({ 
            color: 0xffffff, metalness: 0.1, roughness: 0.2, transmission: 0.6, thickness: 0.4
        });
        
        const instancedVoxels = new THREE.InstancedMesh(voxelGeo, voxelMat, cellCount);
        scene.add(instancedVoxels);

        const dummy = new THREE.Object3D();
        const cellData = [];
        let systemState = 0; // 0=Void/Idle, 1=Sphere, 2=Pyramid, 3=Torus
        let activeShapeIndex = 0;

        const originGeo = new THREE.OctahedronGeometry(2.2, 0);
        const originMat = new THREE.MeshStandardMaterial({ color: 0x38bdf8, emissive: 0x38bdf8, emissiveIntensity: 0.7, wireframe: true });
        const originCrystal = new THREE.Mesh(originGeo, originMat);
        originCrystal.position.set(-15, -6, 2);
        scene.add(originCrystal);

        for (let i = 0; i < cellCount; i++) {
            let theta = Math.random() * Math.PI * 2;
            let phi = Math.acos((Math.random() * 2) - 1);
            let r = 16 + Math.random() * 15;
            let idlePos = new THREE.Vector3(r * Math.sin(phi) * Math.cos(theta), r * Math.sin(phi) * Math.sin(theta), r * Math.cos(phi));
            
            cellData.push({ 
                current: idlePos.clone(), 
                idle: idlePos, 
                target: new THREE.Vector3(), 
                shapePos: new THREE.Vector3(),
                color: new THREE.Color(P.idle),
                speed: 0.03 + Math.random() * 0.03,
                index: i
            });
        }

        function generateGeometryShape(type) {
            for (let i = 0; i < cellCount; i++) {
                let d = cellData[i];
                let pos = new THREE.Vector3();

                if (type === 1) {
                    // รูปทรงที่ 1: ทรงกลม (Sphere)
                    let u = Math.random(), v = Math.random();
                    let theta = u * 2.0 * Math.PI, phi = Math.acos(2.0 * v - 1.0);
                    let r = Math.cbrt(Math.random()) * 9;
                    pos.set(r * Math.sin(phi) * Math.cos(theta), r * Math.sin(phi) * Math.sin(theta), r * Math.cos(phi));
                    d.color.setHex(P.sphere);
                } else if (type === 2) {
                    // รูปทรงที่ 2: พีระมิด (Pyramid)
                    let y = (Math.random() - 0.5) * 14;
                    let widthAtY = (7 - y) * 0.7;
                    if (widthAtY < 0) widthAtY = 0;
                    let x = (Math.random() - 0.5) * widthAtY * 2;
                    let z = (Math.random() - 0.5) * widthAtY * 2;
                    pos.set(x, y, z);
                    d.color.setHex(P.pyramid);
                } else if (type === 3) {
                    // รูปทรงที่ 3: วงแหวนทอรัส (Torus / Donut)
                    let u = Math.random() * Math.PI * 2;
                    let v = Math.random() * Math.PI * 2;
                    let R = 8, r = 3;
                    let x = (R + r * Math.cos(v)) * Math.cos(u);
                    let y = r * Math.sin(v);
                    let z = (R + r * Math.cos(v)) * Math.sin(u);
                    pos.set(x, y, z);
                    d.color.setHex(P.torus);
                }

                d.shapePos.copy(pos);
                d.target.copy(d.shapePos);
            }
        }

        const clock = new THREE.Clock();

        function animate() {
            requestAnimationFrame(animate);
            let time = clock.getElapsedTime();

            originCrystal.rotation.x = time * 0.5;
            originCrystal.rotation.y = time * 0.7;

            for (let i = 0; i < cellCount; i++) {
                let d = cellData[i];

                if (systemState === 0) {
                    d.current.x = d.idle.x + Math.sin(time * 0.4 + i) * 1.0;
                    d.current.y = d.idle.y + Math.cos(time * 0.3 + i) * 1.0;
                    d.current.z = d.idle.z + Math.sin(time * 0.35 + i) * 1.0;
                    instancedVoxels.setColorAt(i, new THREE.Color(P.idle));
                } else {
                    let tx = d.shapePos.x;
                    let ty = d.shapePos.y;
                    let tz = d.shapePos.z;

                    if (systemState === 3) {
                        // หมุนวงแหวนทอรัส
                        let angleOffset = time * 0.8;
                        let currentR = Math.sqrt(tx*tx + tz*tz);
                        let currentAngle = Math.atan2(tz, tx) + angleOffset;
                        tx = Math.cos(currentAngle) * currentR;
                        tz = Math.sin(currentAngle) * currentR;
                    }

                    d.target.set(tx, ty, tz);
                    d.current.lerp(d.target, d.speed);
                    instancedVoxels.setColorAt(i, d.color);
                }

                dummy.position.copy(d.current);
                dummy.rotation.set(time * 0.3, time * 0.4, 0);
                dummy.updateMatrix();
                instancedVoxels.setMatrixAt(i, dummy.matrix);
            }
            
            instancedVoxels.instanceMatrix.needsUpdate = true;
            instancedVoxels.instanceColor.needsUpdate = true;
            
            camera.position.x = Math.sin(time * 0.08) * 35;
            camera.position.z = Math.cos(time * 0.08) * 35;
            camera.lookAt(0, 0, 0);

            renderer.render(scene, camera);
        }
        animate();

        const raycaster = new THREE.Raycaster();
        const mouse = new THREE.Vector2();

        window.addEventListener('pointerdown', (event) => {
            mouse.x = (event.clientX / window.innerWidth) * 2 - 1;
            mouse.y = -(event.clientY / window.innerHeight) * 2 + 1;

            raycaster.setFromCamera(mouse, camera);
            const intersects = raycaster.intersectObject(originCrystal);

            if (intersects.length > 0) {
                activeShapeIndex = (activeShapeIndex % 3) + 1;
                systemState = activeShapeIndex;
                generateGeometryShape(systemState);

                if (systemState === 1) {
                    document.getElementById('hud-title').innerText = "Geometric Shape 1: ทรงกลมพลังงาน (Sphere Voxel)";
                    document.getElementById('hud-sub').innerText = "แสดงการกระจายตัวของอนุภาคในปริภูมิสามมิติเชิงสมมาตร";
                } else if (systemState === 2) {
                    document.getElementById('hud-title').innerText = "Geometric Shape 2: ทรงพีระมิดโครงสร้าง (Pyramid Voxel)";
                    document.getElementById('hud-sub').innerText = "จำลองฐานรากความมั่นคงทางวิศวกรรมและสถาปัตยกรรม";
                } else {
                    document.getElementById('hud-title').innerText = "Geometric Shape 3: วงแหวนทอรัส (Torus Energy Ring)";
                    document.getElementById('hud-sub').innerText = "จำลองการไหลเวียนของพลังงานและกระแสข้อมูลแบบวนรอบ";
                }

                if ('speechSynthesis' in window) {
                    let ut = new SpeechSynthesisUtterance("แปลงรูปทรง");
                    ut.lang = 'th-TH'; ut.pitch = 0.9;
                    window.speechSynthesis.speak(ut);
                }
            } else {
                systemState = 0;
                activeShapeIndex = 0;
                for (let i = 0; i < cellCount; i++) {
                    cellData[i].target.copy(cellData[i].idle);
                    cellData[i].color.setHex(P.idle);
                }
                document.getElementById('hud-title').innerText = "Voxel Geometric Showcase: สุญญตาสู่นวัตกรรม";
                document.getElementById('hud-sub').innerText = 'คลิกที่ "ผลึกแก้ว" ซ้ายล่างเพื่อเปลี่ยนรูปทรงเรขาคณิต | คลิกที่ฉากเพื่อคืนสู่สุญญตา';
            }
        });

        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });
    </script>
</body>
</html>
